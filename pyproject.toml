[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "hr-agent"
requires-python = ">=3.12,<3.13"
version = "0.1.0"
dependencies = [
    "bert-score>=0.3.13",
    "chromadb>=1.5.9",
    "datasets>=5.1.0",
    "gradio>=6.30.0",
    "groq>=0.37.1",
    "langchain>=1.4.4",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.9",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.3",
    "langchain-ollama>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "nltk>=3.10.3",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pypdf>=6.20.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "python-dotenv>=1.2.4",
    "ragas>=0.4.3",
    "rouge-score>=0.1.2",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.1.0",
    "tqdm>=4.70.1",
]

[tool.setuptools.packages.find]
where = ["."]
